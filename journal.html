<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성장카르테 | 크레용숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF6EE; --ivory-deep:#F3EBDC; --forest:#2C4A3B; --clay:#BE6A42;
    --gold:#D3A24C; --berry:#8B4B5C; --sage:#93AC8C; --ink:#2A2622; --paper:#FFFFFF; --line:#E4DBC9;
    --radius-lg:32px; --radius-md:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Noto Sans KR',sans-serif; background:var(--ivory); color:var(--ink); line-height:1.7;}
  .logotype{font-family:'Playfair Display',serif; font-style:italic; font-weight:500;}
  a{color:inherit; text-decoration:none;}
  .eyebrow{font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--clay);}
  .wrap{max-width:820px; margin:0 auto; padding:0 24px;}
  header{padding:18px 0; border-bottom:1px solid var(--line);}
  .header-inner{max-width:820px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center;}
  .brand{font-size:19px; color:var(--forest);}
  .cta-btn{background:var(--clay); color:#fff; padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; border:none; cursor:pointer;}

  .hero{padding:50px 0 20px; text-align:center;}
  .hero h1{font-family:'Noto Serif KR',serif; font-size:clamp(22px,3vw,28px); color:var(--forest); margin-top:10px;}
  .hero p{color:#6b6459; font-size:14px; margin-top:10px;}

  /* ---------- 로그인 ---------- */
  .login-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
    max-width:400px; margin:30px auto; padding:34px;
  }
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--forest); margin-bottom:6px;}
  .field input{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; background:var(--ivory);}
  .login-btn{width:100%; background:var(--forest); color:#fff; padding:13px; border-radius:12px; font-size:14.5px; font-weight:700; border:none; cursor:pointer;}
  .login-err{color:#c0554f; font-size:13px; margin-top:10px; text-align:center; min-height:18px;}
  .privacy-note{font-size:12px; color:#9a9285; text-align:center; margin-top:14px; line-height:1.6;}

  /* ---------- 카르테 표지 ---------- */
  #journalView{display:none;}
  .carte-cover{
    background: radial-gradient(circle at 30% 20%, #F3E3D3 0%, var(--ivory) 60%);
    border-radius:var(--radius-lg); padding:60px 40px; text-align:center; margin-bottom:34px;
    border:1px solid var(--line);
  }
  .carte-cover .brand-mark{font-family:'Playfair Display',serif; font-style:italic; color:var(--clay); font-size:18px;}
  .carte-cover h2{font-family:'Noto Serif KR',serif; font-size:clamp(26px,4vw,36px); color:var(--forest); margin:14px 0 6px;}
  .carte-cover .sub{font-size:13.5px; color:#8a8378; margin-bottom:26px;}
  .cover-photo-ring{
    width:150px; height:150px; border-radius:50%; margin:0 auto 22px; overflow:hidden;
    border:6px solid var(--paper); box-shadow:0 14px 30px -14px rgba(44,74,59,.4); background:var(--ivory-deep);
  }
  .cover-photo-ring img{width:100%; height:100%; object-fit:cover;}
  .carte-cover .child-name{font-family:'Noto Serif KR',serif; font-size:22px; color:var(--forest); margin-bottom:6px;}
  .carte-cover .term{font-size:13.5px; color:var(--clay); font-weight:600;}
  .stat-row{display:flex; justify-content:center; gap:26px; margin-top:26px; flex-wrap:wrap;}
  .stat-row div{font-size:12px; color:#8a8378;}
  .stat-row b{display:block; font-family:'Noto Serif KR',serif; font-size:20px; color:var(--forest);}
  .print-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1.5px solid var(--forest);
    color:var(--forest); padding:9px 18px; border-radius:999px; font-size:13px; font-weight:600; margin-top:26px;
  }
  .logout-link{display:block; text-align:center; font-size:12.5px; color:#8a8378; text-decoration:underline; margin-top:8px;}

  /* ---------- 월별 카드 (원본 PPTX 레이아웃 참고) ---------- */
  .month-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:36px; margin-bottom:26px; position:relative; overflow:hidden;
  }
  .month-num{
    font-family:'Noto Serif KR',serif; font-size:56px; font-weight:700; color:var(--ivory-deep);
    position:absolute; top:14px; right:28px; line-height:1; -webkit-text-stroke:1px var(--line);
  }
  .month-title-row{margin-bottom:20px;}
  .month-badge{display:inline-block; background:var(--forest); color:#fff; font-size:12px; font-weight:700; padding:4px 14px; border-radius:8px;}
  .artwork-title{font-family:'Noto Serif KR',serif; font-size:17px; color:var(--forest); margin-top:10px;}
  .session-theme{font-size:12.5px; color:var(--clay); font-weight:600; margin-top:6px;}

  .carte-grid{display:grid; grid-template-columns:1.2fr 1fr; gap:26px;}
  @media(max-width:640px){ .carte-grid{grid-template-columns:1fr;} }
  .photo-main{width:100%; aspect-ratio:4/3; border-radius:18px; object-fit:cover; background:var(--ivory-deep);}
  .photo-empty{display:flex; align-items:center; justify-content:center; color:#b7ae9e; font-size:12.5px;}
  .photo-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:0;}
  .photo-grid img{width:100%; aspect-ratio:1/1; border-radius:14px; object-fit:cover; background:var(--ivory-deep);}
  .mood-flow{display:flex; align-items:center; gap:14px;}
  .mood-swatch-wrap{display:flex; flex-direction:column; align-items:center; gap:5px; font-size:11.5px; color:#7a7468;}
  .swatch-lg{width:36px; height:36px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.14);}
  .mood-arrow{font-size:16px; color:var(--clay);}
  .mood-note{font-size:11.5px; color:#7a7468; font-style:italic; text-align:center; max-width:110px;}
  .color-chip-row{display:flex; gap:18px; flex-wrap:wrap;}
  .color-chip{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11.5px; color:#7a7468;}
  .summary-filter{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 22px; font-size:13px; color:#7a7468;
  }
  .summary-filter select{padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper); font-size:13px; color:#3f3b34;}
  .filter-reset{padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:12px; cursor:pointer; color:var(--forest);}
  .filter-reset:hover{background:var(--ivory-deep);}
  .filter-save{padding:6px 14px; border-radius:999px; border:none; background:var(--forest); color:#fff; font-size:12px; cursor:pointer;}
  .filter-save:hover{opacity:.9;}
  .filter-saved-msg{font-size:12px; color:var(--sage); font-weight:700;}
  .teacher-login-link{margin-top:16px; text-align:center;}
  .teacher-login-link a{font-size:12.5px; color:#9a9285; text-decoration:underline;}
  .teacher-badge{
    display:inline-block; margin-top:10px; padding:4px 12px; border-radius:999px;
    background:#3A362F; color:#fff; font-size:11.5px; font-weight:700;
  }
  .observation{
    background:var(--ivory-deep); border-radius:14px; padding:16px 18px; margin-top:14px; font-size:13.5px;
    color:#4b463f; line-height:1.8; white-space:pre-line;
  }
  .observation-label{font-size:11.5px; font-weight:700; color:var(--clay); margin-bottom:6px; display:block;}
  .observation::before{content:"“ "; color:var(--clay);}
  .auto-insight{
    background:#EFF4EC; border:1px dashed #C9DCC0; border-radius:14px; padding:14px 18px; margin-top:12px;
    font-size:13px; color:#3f4f3a; line-height:1.8;
  }

  .photo-sub{width:100%; aspect-ratio:4/3; border-radius:18px; object-fit:cover; background:var(--ivory-deep); margin-bottom:16px;}
  .info-block{margin-bottom:14px;}
  .info-label{font-size:11.5px; font-weight:700; color:var(--clay); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; display:block;}
  .color-row{display:flex; align-items:center; gap:10px;}
  .swatch{width:26px; height:26px; border-radius:50%; border:1px solid var(--line); flex-shrink:0;}
  .color-row span{font-family:'Noto Serif KR',serif; font-size:16px; color:var(--forest);}
  .material-pills{display:flex; flex-wrap:wrap; gap:6px;}
  .pill{background:var(--paper); border:1px solid var(--line); font-size:12px; color:var(--forest); padding:5px 12px; border-radius:999px;}

  .empty-state{text-align:center; padding:50px 0; color:#8a8378; font-size:14px;}
  footer{text-align:center; padding:40px 0; font-size:12.5px; color:#8a8378;}

  /* ---------- 종합 요약 (색채 차트 + 원장님 해석) ---------- */
  .summary-section{margin-top:30px;}
  .sec-label{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .sec-label h3{font-family:'Noto Serif KR',serif; font-size:17px; color:var(--forest);}
  .sec-label .tag{font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;}
  .tag-auto{background:#E4F0E0; color:#5C7A56;}
  .tag-manual{background:#F3E3E8; color:var(--berry);}
  .sec-letter{
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    width:26px; height:26px; border-radius:50%; background:var(--forest); color:#fff;
    font-size:13px; font-weight:800; font-family:'Noto Serif KR',serif;
  }

  .timeline-card, .freq-card, .wheel-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:28px 26px; margin-bottom:16px;}
  .wheel-card{text-align:center;}
  .wheel-card svg{max-width:280px; margin:0 auto;}
  .wheel-caption{font-size:12px; color:#9a9285; margin-top:10px;}
  .timeline{display:flex; align-items:flex-end; gap:6px; position:relative; padding-top:10px; flex-wrap:wrap;}
  .t-node{flex:1; min-width:60px; text-align:center;}
  .t-dot{width:24px; height:24px; border-radius:50%; margin:0 auto 8px; border:3px solid #fff; box-shadow:0 0 0 1px var(--line);}
  .t-node .r{font-size:10.5px; color:var(--clay); font-weight:700;}
  .t-node .c{font-family:'Noto Serif KR',serif; font-size:13px; color:var(--forest); margin-top:2px;}

  .freq-row{display:flex; align-items:center; gap:14px; margin-bottom:12px;}
  .freq-row:last-child{margin-bottom:0;}
  .freq-label{width:76px; font-size:12.5px; color:var(--forest); font-weight:600; flex-shrink:0;}
  .freq-bar-bg{flex:1; background:var(--ivory-deep); border-radius:8px; height:18px; overflow:hidden;}
  .freq-bar{height:100%; border-radius:8px;}
  .freq-count{width:20px; font-size:12px; color:#8a8378; text-align:right;}

  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  @media(max-width:560px){ .cat-grid{grid-template-columns:1fr;} }
  .cat-card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px 18px;}
  .cat-card .name{font-size:12px; font-weight:700; color:var(--clay); margin-bottom:6px;}
  .cat-card .flow{font-family:'Noto Serif KR',serif; font-size:14px; color:var(--forest); display:flex; align-items:center; gap:6px;}
  .cat-card .flow .arrow{color:var(--gold); font-size:13px;}

  .highlight-list{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:22px 24px; margin-bottom:16px;}
  .highlight-list div{display:flex; gap:10px; margin-bottom:10px; font-size:13.5px; color:#3f3b34;}
  .highlight-list div:last-child{margin-bottom:0;}
  .highlight-list .check{color:var(--sage); font-weight:900;}

  /* ---------- 색상×톤 그리드 (색상심리 체크판) ---------- */
  .tone-grid-head{display:grid; grid-template-columns:56px repeat(3,1fr); gap:6px; margin-bottom:8px; font-size:11px; color:#9a9285; text-align:center;}
  .tone-row{display:grid; grid-template-columns:56px repeat(3,1fr); gap:6px; margin-bottom:6px; align-items:center;}
  .tone-row-label{font-size:12px; font-weight:700; color:var(--forest); text-align:right; padding-right:4px;}
  .tone-cell{height:32px; border-radius:8px; border:1px solid rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; opacity:.32; transition:opacity .2s;}
  .tone-cell.picked{opacity:1; box-shadow:0 0 0 2px var(--paper), 0 0 0 3.5px var(--clay);}
  .tone-mark{color:#fff; font-size:11.5px; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.45);}

  /* ---------- 재료 효과 비율 바 ---------- */
  .effect-bar{display:flex; height:22px; border-radius:11px; overflow:hidden; margin-bottom:14px;}
  .effect-seg{height:100%;}
  .effect-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:#4b463f;}
  .effect-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle;}

  .info-note{font-size:13px; color:#4b463f; line-height:1.7;}
  .keyword-group{margin-bottom:16px;}
  .keyword-group:last-child{margin-bottom:0;}
  .keyword-group-label{font-size:11.5px; font-weight:700; color:var(--clay); margin-bottom:8px; display:block;}

  .ability-board{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px;}
  .ability-group{margin-bottom:20px;}
  .ability-group:last-of-type{margin-bottom:0;}
  .ability-group-label{font-size:12.5px; font-weight:700; color:var(--forest); margin-bottom:10px; display:block;}
  .ability-mini-group{margin-bottom:8px;}
  .ability-mini-group:last-child{margin-bottom:0;}
  .ability-mini-label{font-size:11px; font-weight:700; color:#9a9285; margin-bottom:4px; display:block;}
  .ability-badge{background:var(--ivory-deep); border-radius:14px; padding:12px 14px;}
  .ability-badge.standout{background:#FCEFD8; border:1px solid #E8CE95;}
  .ability-name{display:block; font-weight:700; color:var(--forest); font-size:12.5px; margin-bottom:2px;}
  .ability-count{display:block; color:#9a9285; font-size:11px; margin-bottom:6px;}
  .ability-desc{display:block; color:#6b6459; font-size:11.5px; line-height:1.5;}
  .growth-narrative{
    background:#F7EFE4; border:1px solid #EAD9BE; border-radius:var(--radius-md); padding:20px 24px;
    font-size:14px; color:var(--forest); font-family:'Noto Serif KR',serif; line-height:1.8; margin-bottom:16px;
  }

  .gallery-heading{font-size:12.5px; font-weight:700; color:var(--clay); margin:0 0 12px 4px; letter-spacing:.2px;}
  .gallery-wrap{position:relative; display:flex; align-items:center; gap:6px;}
  .gallery-nav{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--paper); color:var(--forest); font-size:18px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .gallery-nav:hover{background:var(--ivory-deep);}
  .gallery-strip{display:flex; gap:14px; overflow-x:auto; padding:4px 4px 20px; margin-bottom:8px; -webkit-overflow-scrolling:touch; scroll-behavior:smooth;}
  .gallery-item{flex:0 0 auto; width:96px; text-align:center; cursor:pointer;}
  .gallery-item:hover .gallery-thumb, .gallery-item:hover .gallery-thumb-empty{transform:translateY(-3px); box-shadow:0 8px 16px rgba(0,0,0,.12);}
  .gallery-thumb{width:96px; height:96px; border-radius:14px; object-fit:cover; border:2px solid var(--paper); box-shadow:0 4px 10px rgba(0,0,0,.08); transition:transform .2s, box-shadow .2s;}
  .gallery-thumb-empty{width:96px; height:96px; border-radius:14px; background:var(--ivory-deep); display:flex; align-items:center; justify-content:center; font-size:10.5px; color:#b7ae9e; transition:transform .2s, box-shadow .2s;}
  .gallery-caption{margin-top:7px; font-size:10.5px; color:#7a7468; line-height:1.4;}
  .gallery-caption b{display:block; color:var(--forest); font-size:12px; font-weight:700;}

  .split{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){ .split{grid-template-columns:1fr;} }
  .split-card{border-radius:var(--radius-md); padding:22px 24px; font-size:13.5px; color:#4b463f;}
  .split-card.strength{background:#EFF4EC; border:1px solid #D7E3CF;}
  .split-card.direction{background:#F7EFE4; border:1px solid #EAD9BE;}
  .split-card h4{font-family:'Noto Serif KR',serif; font-size:14px; color:var(--forest); margin-bottom:8px;}

  /* ---------- 인쇄 (개인 책자용) ---------- */
  @media print{
    header, .privacy-note, .logout-link, .print-btn{ display:none !important; }
    body{ background:#fff; }
    .wrap{ max-width:100%; padding:0; }
    .carte-cover{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; page-break-after:always; border-radius:0; }
    .month-card{ page-break-after:always; box-shadow:none; min-height:95vh; display:flex; flex-direction:column; justify-content:center; }
    .month-card:last-child{ page-break-after:auto; }
    .summary-section{ page-break-before:always; }
    footer{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="brand logotype">Forêt des Crayons</a>
    <a href="index.html" class="cta-btn">홈으로</a>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">Growth Journal</div>
    <h1>우리 아이 성장카르테</h1>
    <p>그림을 통해 본 우리 아이 마음의 성장 이야기를 확인해보세요.</p>
  </div>

  <div id="loginView">
    <div class="login-card">
      <div class="field">
        <label>자녀 이름</label>
        <input type="text" id="jName" placeholder="예: 김민준">
      </div>
      <div class="field">
        <label>보호자 전화번호 뒷 4자리</label>
        <input type="password" id="jPhone4" maxlength="4" placeholder="예: 1234" inputmode="numeric" onkeydown="if(event.key==='Enter') checkJournal()">
      </div>
      <button class="login-btn" onclick="checkJournal()">성장카르테 확인하기</button>
      <div class="login-err" id="jErr"></div>
      <div class="privacy-note">등록하신 이름과 전화번호 뒷자리로 우리 아이의 기록만 확인할 수 있어요.<br>다른 친구들의 기록은 보이지 않습니다.</div>
      <div class="teacher-login-link"><a href="#" onclick="teacherLogin(event)">선생님이신가요? 여기서 로그인</a></div>
    </div>
  </div>

  <div id="journalView">
    <div class="carte-cover">
      <div class="brand-mark">Forêt des Crayons</div>
      <h2 id="jCarteTitle">성장카르테</h2>
      <p class="sub">그림을 통해 본 어린이 마음의 성장 이야기</p>
      <div class="cover-photo-ring" id="coverPhotoRing"><div style="width:100%;height:100%;"></div></div>
      <div class="child-name" id="jChildName"></div>
      <div class="teacher-badge" id="jTeacherBadge" style="display:none;">🔑 선생님 화면 (학부모에게는 안 보여요) · <a href="teacher-entry.html" style="text-decoration:underline;">회차 입력하러 가기</a></div>
      <div class="term" id="jTerm"></div>
      <div class="stat-row" id="jStatRow"></div>
      <div><button class="print-btn" onclick="window.print()">🖨️ 개인 책자로 인쇄 / PDF 저장</button></div>
    </div>
    <div id="jGallery"></div>
    <div id="jEntries"></div>
    <div id="jSummaryFilter"></div>
    <div id="jSummary"></div>
    <a href="#" class="logout-link" onclick="logoutJournal(event)">다른 아이 이름으로 다시 확인하기</a>
  </div>
</div>

<footer>© 2026 Forêt des Crayons</footer>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyahvBkqM7NVzHde2vdtpWTGdOhaUs8i-ewGe9WBpuyyetVIv1VEPJrhhCNy3fgrmad/exec";
const MAIN_COLOR_HEX = {
  "빨강":"#D96B5C","주황":"#E0A24C","노랑":"#E8CE68","연두":"#9ACD32","초록":"#8FA888","청록":"#5C9A93",
  "파랑":"#5C7FA6","남색":"#41577A","보라":"#8B6BA6","분홍":"#D98FA6","갈색":"#8A6B4E",
  "회색":"#A6A29A","검정":"#3A362F","흰색":"#F3EBDC","보랏빛 파랑":"#6E6BA6",
  "민트":"#7FBFA6","핑크":"#D98FA6","자주":"#8B4B5C","무지개":"#C9A6D9"
};
const TONE_COLS = ['deep','vivid','pastel'];
const TONE_HUES = ['검정','빨강','주황','노랑','연두','초록','파랑','보라','핑크'];
const HUE_TONE_HEX = {
  검정:{deep:'#2B2B2B',vivid:'#6B6B6B',pastel:'#E6E2DA'},
  빨강:{deep:'#8E1B1B',vivid:'#E63946',pastel:'#F3B7B0'},
  주황:{deep:'#8A4A12',vivid:'#F2812E',pastel:'#F5CBA0'},
  노랑:{deep:'#8A7B12',vivid:'#F2E22E',pastel:'#F5F0A8'},
  연두:{deep:'#4B6B1E',vivid:'#9ACD32',pastel:'#D6EFB0'},
  초록:{deep:'#1F4B33',vivid:'#2E8B57',pastel:'#A8D8C0'},
  파랑:{deep:'#1B3A6B',vivid:'#3E6FE0',pastel:'#AFC6EF'},
  보라:{deep:'#4A1B6B',vivid:'#8E4FD1',pastel:'#D6BEEF'},
  핑크:{deep:'#6B1B4A',vivid:'#E24FA0',pastel:'#F5C2E0'}
};
function toneHex(hue, tone){
  const t = TONE_COLS.includes(tone) ? tone : 'vivid';
  return (HUE_TONE_HEX[hue] && HUE_TONE_HEX[hue][t]) || MAIN_COLOR_HEX[hue] || '#ccc';
}

// 감정·성장 키워드를 자유 텍스트 그대로 두되, 몇 가지 큰 갈래로 묶어서 보여주기
// 위한 사전. 완벽한 분류는 아니고, 실제 자주 쓰이는 표현 기준으로 구성했어요.
// 사전에 없는 단어는 자동으로 "기타" 갈래로 들어가고, 절대 숨기지 않아요.
const KEYWORD_CATEGORIES = [
  ['자기이해·자신감', ['자기이해','자기수용','자기인식','자기존중','자기격려','자기표현','자신감','용기','주도성','주체']],
  ['정서표현', ['감정표현','감정인식','기쁨','슬픔','분노','화남','두려움','불안','안정감','차분함','뿌듯함','애정표현','애착','가족애','상징화','기억','부드러운표현','내면표현','만족감','편안']],
  ['관계·사회성', ['관계','회복력','협동','배려','공감','소통','한결같음','신뢰']],
  ['사고·문제해결', ['사고력','문제해결','창의','주도력','계획','집중력','논리','판단력']],
  ['감각·신체발달', ['손가락','운동력','감각탐색','심신','형태','상상력','색채감각','대근육','소근육']],
  ['놀이성·호기심', ['놀이성','자유로움','즐거움','즐기','호기심','도전','언어확장','탐구']]
];
function categorizeKeyword(k){
  for(const [cat, roots] of KEYWORD_CATEGORIES){
    if(roots.some(root => k.includes(root) || root.includes(k))) return cat;
  }
  return '기타';
}

// 항목 이름은 일반적인 아동미술교육 용어이고, 설명 문구는 전부 새로 쓴

const ABILITY_DEFS = {

  '응용력·전개력':'배운 것을 다른 상황에 적용하고 새로운 시도로 넓혀가는 힘',

  '촉감·탐구심':'재료를 만지고 탐색하며 성질을 알아가는 호기심',
  '조화감각':'색과 형태를 서로 어울리게 배치하는 감각',

  return null;
}
// 미술능력(조형·색채 등 표현 기술) / 마음의 능력(사회성·집중력 등 내면의 힘)으로 구분
const ABILITY_GROUP = {
  '조형력':'미술능력', '색채감각':'미술능력', '조화감각':'미술능력', '발상력':'미술능력',
  '촉감·탐구심':'미술능력', '이야기전개성':'미술능력', '응용력·전개력':'미술능력', '관찰력':'미술능력',
  '성취력':'마음의 능력', '사회성':'마음의 능력', '자립심':'마음의 능력',
  '집중력':'마음의 능력', '계획성':'마음의 능력', '언어표현':'마음의 능력'
};
function hasJongseong(str){
  const c = str.charCodeAt(str.length-1) - 0xAC00;
  if(c < 0 || c > 11171) return false;
  return (c % 28) !== 0;
}
const HUE_ANGLE = {
  "빨강":0,"다홍":18,"주황":42,"노랑":80,"연두":110,"초록":140,"청록":175,"민트":190,
  "파랑":210,"남색":235,"보랏빛 파랑":250,"보라":270,"자주":290,"분홍":330,"핑크":330,"갈색":25
};
function getHueAngle(name){
  if(!name) return null;
  if(name in HUE_ANGLE) return HUE_ANGLE[name];
  for(const k in HUE_ANGLE){ if(name.includes(k)) return HUE_ANGLE[k]; }
  return null; // 회색/검정/흰색 등 무채색 → 중심 근처
}
const MATERIAL_ZONE = {
  angles: { "사고활동":300, "감정활동":60, "뉴트럴":180 },
  bounds: { "사고활동":[240,360], "감정활동":[0,120], "뉴트럴":[120,240] },
  colors: { "사고활동":"#93AC8C", "감정활동":"#BE6A42", "뉴트럴":"#D3A24C" }
};
function normalizeZone(v){
  if(!v) return null;
  if(v.includes('사고')) return '사고활동';
  if(v.includes('감정')) return '감정활동';
  if(v.includes('뉴트럴') || v.includes('중립')) return '뉴트럴';
  return null;
}
function polar(cx,cy,r,angDeg){
  const a = angDeg*Math.PI/180;
  return { x: cx + r*Math.sin(a), y: cy - r*Math.cos(a) };
}
function wedgePath(cx,cy,r,startAngle,endAngle){
  const p1 = polar(cx,cy,r,startAngle), p2 = polar(cx,cy,r,endAngle);
  return `M${cx},${cy} L${p1.x.toFixed(1)},${p1.y.toFixed(1)} A${r},${r} 0 0 1 ${p2.x.toFixed(1)},${p2.y.toFixed(1)} Z`;
}
function renderMaterialWheel(entries){
  const zoned = entries.map(e => ({ ...e, zone: normalizeZone(e.materialEffect) })).filter(e => e.zone);
  if(zoned.length < 2) return '';
  const cx=140, cy=140, minR=26, maxR=112;

  const wedges = Object.entries(MATERIAL_ZONE.bounds).map(([name,[s,e]]) =>
    `<path d="${wedgePath(cx,cy,maxR,s,e)}" fill="${MATERIAL_ZONE.colors[name]}" opacity="0.12"/>`
  ).join('');

  const labels = Object.entries(MATERIAL_ZONE.angles).map(([name,ang]) => {
    const pt = polar(cx,cy,maxR+22,ang);
    return `<text x="${pt.x}" y="${pt.y}" font-size="10.5" fill="${MATERIAL_ZONE.colors[name]}" font-weight="700" text-anchor="middle" dominant-baseline="middle">${name}</text>`;
  }).join('');

  let dots='', path='';
  zoned.forEach((e,i)=>{
    const [s,end] = MATERIAL_ZONE.bounds[e.zone];
    const jitter = ((i % 3) - 1) * ((end-s)/5);
    const ang = MATERIAL_ZONE.angles[e.zone] + jitter;
    const r = minR + (zoned.length<=1?0.5:i/(zoned.length-1))*(maxR-minR);
    const pt = polar(cx,cy,r,ang);
    dots += `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="7" fill="${MATERIAL_ZONE.colors[e.zone]}" stroke="#fff" stroke-width="2"/>`;
    path += (i===0?'M':'L') + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ' ';
  });

  return `
    <div class="wheel-card">
      <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--clay)"/></marker></defs>
        ${wedges}
        <circle cx="${cx}" cy="${cy}" r="${maxR}" fill="none" stroke="#E4DBC9" stroke-width="1"/>
        ${labels}
        <path d="${path}" fill="none" stroke="var(--clay)" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow2)"/>
        ${dots}
      </svg>
      <div class="wheel-caption">중심에서 바깥쪽으로 갈수록 최근 회차예요 · 어느 영역(사고·감정·뉴트럴)에서 주로 활동했는지 흐름을 보여줘요</div>
    </div>`;
}

function renderColorWheel(entries){
  const colored = entries.filter(e => e.mainColor);
  if(colored.length < 2) return '';
  const size=280, cx=140, cy=140, minR=26, maxR=112;
  const hueLabels = [["빨강",0],["주황",42],["노랑",80],["초록",140],["청록",175],["파랑",210],["보라",270],["분홍",330]];
  let rings = [0.33,0.66,1].map(f=>`<circle cx="${cx}" cy="${cy}" r="${minR+(maxR-minR)*f}" fill="none" stroke="#E4DBC9" stroke-width="1"/>`).join('');
  let labels = hueLabels.map(([name,ang])=>{
    const a=ang*Math.PI/180, x=cx+(maxR+18)*Math.sin(a), y=cy-(maxR+18)*Math.cos(a);
    return `<text x="${x}" y="${y}" font-size="10" fill="#9a9285" text-anchor="middle" dominant-baseline="middle">${name}</text>`;
  }).join('');
  let dots='', path='';
  colored.forEach((e,i)=>{
    const ang = getHueAngle(e.mainColor);
    const r = ang===null ? minR*0.5 : minR + (colored.length<=1?0.5:i/(colored.length-1))*(maxR-minR);
    const a = (ang===null?0:ang)*Math.PI/180;
    const x = cx + r*Math.sin(a), y = cy - r*Math.cos(a);
    dots += `<circle cx="${x}" cy="${y}" r="7" fill="${MAIN_COLOR_HEX[e.mainColor]||'#999'}" stroke="#fff" stroke-width="2"/>`;
    path += (i===0?'M':'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  });
  return `
    <div class="wheel-card">
      <svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--clay)"/></marker></defs>
        ${rings}
        <text x="${cx}" y="${cy}" font-size="10" fill="#9a9285" text-anchor="middle" dominant-baseline="middle">무채색</text>
        ${labels}
        <path d="${path}" fill="none" stroke="var(--clay)" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
        ${dots}
      </svg>
      <div class="wheel-caption">중심(무채색)에서 바깥쪽으로 갈수록 최근 회차예요 · 점을 이은 화살표가 색채 변화의 흐름을 보여줘요</div>
    </div>`;
}

// 색상×톤 체크판: 아이가 고른 색과 톤(deep/vivid/pastel)이 어디쯤인지
// 예전에 손으로 표시하던 종이 체크판을 그대로 디지털 버전으로 보여줘요.
function renderToneGrid(entries){
  const picks = {};
  entries.forEach(e=>{
    const tone = e.tone;
    if(!TONE_COLS.includes(tone)) return;
    [e.color1, e.color2, e.color3].filter(Boolean).forEach(c=>{
      if(!TONE_HUES.includes(c)) return;
      const key = c + '|' + tone;
      picks[key] = (picks[key] || 0) + 1;
    });
  });
  if(Object.keys(picks).length === 0) return '';

  const rows = TONE_HUES.map(hue => {
    const cells = TONE_COLS.map(tone => {
      const key = hue + '|' + tone;
      const count = picks[key] || 0;
      return `<div class="tone-cell${count ? ' picked' : ''}" style="background:${toneHex(hue,tone)};" title="${hue} · ${tone}${count ? ' · '+count+'회' : ''}">${count ? `<span class="tone-mark">${count>1?count:'●'}</span>` : ''}</div>`;
    }).join('');
    return `<div class="tone-row"><div class="tone-row-label">${hue}</div>${cells}</div>`;
  }).join('');

  return `
    <div class="wheel-card" style="text-align:left;">
      <div class="tone-grid-head"><div></div><div>deep</div><div>vivid</div><div>pastel</div></div>
      ${rows}
      <div class="wheel-caption" style="text-align:left; margin-top:14px; line-height:1.9;">
        진하고 탁할수록 강한 의욕과 에너지, 조금 더 깊고 묵직한 감정을 나타낼 수 있어요. 맑고 연할수록 부드럽고 편안한 마음, 조용히 쉬고 싶은 마음을 나타낼 수 있어요.<br>
        빨, 주, 노, 연두 색은 의욕, 에너지, 몸을 움직이고 싶은 마음과 연결됩니다.<br>
        초록 계열의 색은 마음의 균형, 안정감, 편안함과 연결됩니다.<br>
        파랑, 보라, 핑크 계열의 색은 생각하는 힘, 상상력, 스스로 표현하고 싶은 마음과 연결됩니다.<br>
        표시된 색은 우리 아이가 수업 안에서 실제로 고른 색과 톤입니다.<br>
        색 하나로 마음을 단정하기보다 아이의 말과 행동, 작품 이야기와 함께 살펴봅니다.
      </div>
    </div>`;
}

// 재료 효과 비율: 사고활동(집중)·감정활동(발산)·뉴트럴(중립) 중 어느 쪽으로
// 더 많이 활동했는지 전체 회차 기준 비율로 보여줘요.
function renderEffectBalance(entries){
  const zoned = entries.map(e => normalizeZone(e.materialEffect)).filter(Boolean);
  if(!zoned.length) return '';
  const counts = {'감정활동':0, '뉴트럴':0, '사고활동':0};
  zoned.forEach(z => counts[z]++);
  const total = zoned.length;
  const seg = name => `<div class="effect-seg" style="width:${(counts[name]/total*100)}%; background:${MATERIAL_ZONE.colors[name]};" title="${name} ${Math.round(counts[name]/total*100)}%"></div>`;
  const legend = name => `<span><i style="background:${MATERIAL_ZONE.colors[name]}"></i>${name === '감정활동' ? '감정활동(발산효과)' : name === '뉴트럴' ? '뉴트럴(중립)' : '사고활동(집중효과)'} ${counts[name]}회</span>`;
  return `
    <div class="freq-card">
      <div class="effect-bar">${seg('감정활동')}${seg('뉴트럴')}${seg('사고활동')}</div>
      <div class="effect-legend">${legend('감정활동')}${legend('뉴트럴')}${legend('사고활동')}</div>
    </div>`;
}

// 감정·성장 키워드 모음: 갈래별로 묶어서 보여주고, 그 아이한테 가장 많이
// 나온 갈래가 위로 오도록 정렬해요. 자주 등장한 키워드일수록 크게 보여줘요.
function renderKeywordCloud(entries){
  const counts = {};
  entries.forEach(e => (e.emotionKeywords||[]).forEach(k => { if(k) counts[k] = (counts[k]||0) + 1; }));
  const keys = Object.keys(counts);
  if(!keys.length) return '';
  const max = Math.max(...Object.values(counts));

  const groups = {};
  keys.forEach(k => {
    const cat = categorizeKeyword(k);
    (groups[cat] = groups[cat] || []).push(k);
  });

  const groupTotal = cat => groups[cat].reduce((s,k)=>s+counts[k], 0);
  const orderedCats = Object.keys(groups).sort((a,b) => {
    if(a === '기타') return 1;
    if(b === '기타') return -1;
    return groupTotal(b) - groupTotal(a);
  });

  const groupsHtml = orderedCats.map(cat => {
    const pills = groups[cat].sort((a,b)=>counts[b]-counts[a]).map(k => {
      const size = 12 + Math.round((counts[k]/max) * 6);
      return `<span class="pill" style="font-size:${size}px;">${k}${counts[k]>1?` ×${counts[k]}`:''}</span>`;
    }).join('');
    return `<div class="keyword-group"><span class="keyword-group-label">${cat}</span><div class="material-pills">${pills}</div></div>`;
  }).join('');

  return `<div class="freq-card">${groupsHtml}</div>`;
}

// 지난 회차와 비교해서 달라진 점을 문장으로 자동 생성 (색, 톤, 재료 효과 영역,
// 새로 등장한 감정 키워드). 첫 회차는 비교 대상이 없어서 건너뜁니다.
function buildAutoInsights(entries){
  const seenKeywords = new Set();
  let colorStreak = 1;
  const RANK = {pastel:0, vivid:1, deep:2};
  return entries.map((e, i) => {
    const lines = [];
    const prev = i > 0 ? entries[i-1] : null;

    if(prev){
      if(e.color1 && prev.color1){
        if(e.color1 === prev.color1){
          colorStreak++;
          if(colorStreak >= 2) lines.push(`"${e.color1}" 색을 ${colorStreak}회 연속으로 선택했어요.`);
        } else {
          colorStreak = 1;
          lines.push(`대표 색이 "${prev.color1}"에서 "${e.color1}"(으)로 바뀌었어요.`);
        }
      }
      if(e.tone && prev.tone && e.tone !== prev.tone && (e.tone in RANK) && (prev.tone in RANK)){
        lines.push(RANK[e.tone] > RANK[prev.tone]
          ? `색의 톤이 더 진하고 또렷해졌어요 (${prev.tone} → ${e.tone}).`
          : `색의 톤이 더 맑고 부드러워졌어요 (${prev.tone} → ${e.tone}).`);
      }
      const curZone = normalizeZone(e.materialEffect), prevZone = normalizeZone(prev.materialEffect);
      if(curZone && prevZone && curZone !== prevZone){
        lines.push(`활동 영역이 "${prevZone}"에서 "${curZone}"(으)로 옮겨갔어요.`);
      }
    }

    const newKeywords = (e.emotionKeywords||[]).filter(k => k && !seenKeywords.has(k));
    (e.emotionKeywords||[]).forEach(k => k && seenKeywords.add(k));
    if(prev && newKeywords.length){
      lines.push(`이번에 처음 "${newKeywords.join(', ')}" 감정이 나타났어요.`);
    }

    e.autoInsight = lines.join('<br>');
    return e;
  });
}

// 성장 능력을 미술능력/마음의 능력/신체능력 세 갈래로 나눠 배지로 보여주고,
// 가장 많이 언급된 상위 3개(전체 기준)에 ⭐ 표시해요. "미술능력/마음의 능력/신체능력"
// 칸에 직접 적힌 데이터를 우선 쓰고, 옛 방식(자유 텍스트 한 칸)으로만 적힌 회차는
// 자동 분류해서 같이 집계해요.
function renderAbilityBoard(entries){
  const counts = { '미술능력':{}, '마음의 능력':{}, '신체능력':{} };
  const bump = (group, text) => String(text||'').split(/[,、\n·]/).map(s=>s.trim()).filter(Boolean).forEach(t=>{
    counts[group][t] = (counts[group][t]||0) + 1;
  });
  entries.forEach(e => {
    if(e.artAbility || e.mindAbility || e.bodyAbility){
      bump('미술능력', e.artAbility);
      bump('마음의 능력', e.mindAbility);
      bump('신체능력', e.bodyAbility);
    } else if(e.growingAbility){
      String(e.growingAbility).split(/[,、\n·]/).map(s=>s.trim()).filter(Boolean).forEach(t=>{
        const cat = categorizeAbility(t);
        const group = cat ? ABILITY_GROUP[cat] : null;
        if(group) counts[group][t] = (counts[group][t]||0) + 1;
      });
    }
  });

  const allCounts = {};
  Object.values(counts).forEach(g => Object.entries(g).forEach(([k,v]) => { allCounts[k] = (allCounts[k]||0) + v; }));
  const allTags = Object.keys(allCounts);
  if(!allTags.length) return '';
  const top = new Set(allTags.sort((a,b)=>allCounts[b]-allCounts[a]).slice(0, Math.min(3, allTags.length)));

  const badge = (tag, n) => `
    <div class="ability-badge${top.has(tag) ? ' standout' : ''}">
      <span class="ability-name">${tag}${top.has(tag) ? ' ⭐' : ''}</span>
      <span class="ability-count">${n}회 언급</span>
      ${ABILITY_DEFS[tag] ? `<span class="ability-desc">${ABILITY_DEFS[tag]}</span>` : ''}
    </div>`;

  const group = (title, groupCounts) => {
    const keys = Object.keys(groupCounts).sort((a,b)=>groupCounts[b]-groupCounts[a]);
    if(!keys.length) return '';
    return `
    <div class="ability-group">
      <span class="ability-group-label">${title}</span>
      <div class="ability-board">${keys.map(k=>badge(k, groupCounts[k])).join('')}</div>
    </div>`;
  };

  return `<div class="freq-card">${group('미술능력', counts['미술능력'])}${group('마음의 능력', counts['마음의 능력'])}${group('신체능력', counts['신체능력'])}<div class="wheel-caption" style="margin-top:10px;">⭐ 표시는 이번 학기 중 특히 자주 관찰된 성장 영역이에요 (언급 빈도 기준)</div></div>`;
}

// 색상×톤을 하나의 원형 차트에: 각도 = 색상, 반지름 = 톤(바깥 pastel → 안쪽 deep),
// 회차 순서를 화살표로 이어서 6개월 색채 여정을 한눈에 보여줘요.
function renderColorToneWheel(entries){
  const usable = entries.filter(e => e.color1);
  if(usable.length < 2) return '';
  const size=280, cx=140, cy=140;
  const RADIUS = {pastel:112, vivid:78, deep:44};
  const ringsHtml = Object.values(RADIUS).map(r=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E4DBC9" stroke-width="1"/>`).join('');
  const hueLabels = [["빨강",0],["주황",42],["노랑",80],["초록",140],["파랑",210],["보라",270],["핑크",330]];
  const labels = hueLabels.map(([name,ang])=>{
    const a=ang*Math.PI/180, x=cx+(RADIUS.pastel+18)*Math.sin(a), y=cy-(RADIUS.pastel+18)*Math.cos(a);
    return `<text x="${x}" y="${y}" font-size="10" fill="#9a9285" text-anchor="middle" dominant-baseline="middle">${name}</text>`;
  }).join('');
  const toneLabels = `
    <text x="${cx}" y="${cy-RADIUS.pastel+12}" font-size="9" fill="#b7ae9e" text-anchor="middle">pastel</text>
    <text x="${cx}" y="${cy-RADIUS.vivid+12}" font-size="9" fill="#b7ae9e" text-anchor="middle">vivid</text>
    <text x="${cx}" y="${cy-RADIUS.deep+12}" font-size="9" fill="#b7ae9e" text-anchor="middle">deep</text>`;

  let dots='', path='';
  usable.forEach((e,i)=>{
    const ang = getHueAngle(e.color1);
    const r = ang===null ? 14 : (RADIUS[e.tone] || RADIUS.vivid);
    const a = (ang===null?0:ang)*Math.PI/180;
    const x = cx + r*Math.sin(a), y = cy - r*Math.cos(a);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${toneHex(e.color1,e.tone)}" stroke="#fff" stroke-width="2"/>`;
    path += (i===0?'M':'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  });

  return `
    <div class="wheel-card">
      <svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--clay)"/></marker></defs>
        ${ringsHtml}
        <circle cx="${cx}" cy="${cy}" r="14" fill="#3A362F" opacity="0.15"/>
        ${labels}
        ${toneLabels}
        <path d="${path}" fill="none" stroke="var(--clay)" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow3)"/>
        ${dots}
      </svg>
      <div class="wheel-caption">바깥쪽(pastel)일수록 편안하고 부드럽게, 안쪽(deep)일수록 강하고 짙게 · 화살표는 회차 순서를 보여줘요</div>
    </div>`;
}

const STYLE_PHRASES = {
  'deep|사고활동':'힘있게 몰입하며 파고드는', 'deep|감정활동':'강렬하게 감정을 쏟아내는', 'deep|뉴트럴':'단단하게 자기 세계를 다지는',
  'vivid|사고활동':'또렷하게 생각을 펼쳐내는', 'vivid|감정활동':'생생하게 감정을 표현하는', 'vivid|뉴트럴':'활기차게 탐색하는',
  'pastel|사고활동':'차분히 정리해나가는', 'pastel|감정활동':'부드럽게 마음을 여는', 'pastel|뉴트럴':'편안하게 자기 속도로 나아가는'
};
function styleFor(e){
  const zone = normalizeZone(e.materialEffect);
  return STYLE_PHRASES[`${e.tone}|${zone}`] || null;
}
// 첫 회차와 최근 회차의 톤·재료효과를 비교해서 한 줄 성장 요약 문장을 자동으로 지어요.
function renderGrowthNarrative(entries, childName){
  const withData = entries.filter(e => e.tone && normalizeZone(e.materialEffect));
  if(withData.length < 2) return '';
  const startPhrase = styleFor(withData[0]);
  const endPhrase = styleFor(withData[withData.length-1]);
  if(!startPhrase || !endPhrase || startPhrase === endPhrase) return '';
  const particle = hasJongseong(childName) ? '은' : '는';
  return `<div class="growth-narrative">✨ ${childName}${particle} "${startPhrase}" 모습에서 시작해서, 지금은 "${endPhrase}" 모습을 보여주고 있어요.</div>`;
}

// 데이터 패턴을 바탕으로 양육 힌트 초안을 자동 제안해요 (선생님 확인·첨삭 필요).
function renderParentingHints(entries){
  if(entries.length < 2) return '';
  const hints = [];

  const zoneCounts = {};
  entries.map(e=>normalizeZone(e.materialEffect)).filter(Boolean).forEach(z=>zoneCounts[z]=(zoneCounts[z]||0)+1);
  const topZone = Object.keys(zoneCounts).sort((a,b)=>zoneCounts[b]-zoneCounts[a])[0];
  if(topZone === '감정활동') hints.push('감정을 마음껏 쏟아낼 때는 판단하지 않고 스킨십이나 공감으로 반응해주면 좋아요.');
  if(topZone === '사고활동') hints.push('무언가에 몰입해서 파고들 때는 시간을 충분히 확보해주면 집중력이 더 자라요.');
  if(topZone === '뉴트럴') hints.push('차분하게 자기 속도로 해나갈 때는 다그치지 않고 지켜봐주는 게 좋아요.');

  const tones = entries.map(e=>e.tone).filter(t=>TONE_COLS.includes(t));
  if(tones.length >= 2){
    const rank = {pastel:0, vivid:1, deep:2};
    if(rank[tones[tones.length-1]] > rank[tones[0]]) hints.push('요즘 에너지가 강해지는 시기예요 — 왕성한 도전과 호기심을 뒷받침해주면 좋아요.');
    else if(rank[tones[tones.length-1]] < rank[tones[0]]) hints.push('요즘 마음이 편안해지는 시기예요 — 급하게 재촉하지 않고 여유를 주면 좋아요.');
  }

  const abilityCounts = {};
  entries.forEach(e => String(e.growingAbility||'').split(/[,、\n·]/).map(s=>s.trim()).filter(Boolean).forEach(t=>{
    const cat = categorizeAbility(t);
    if(cat) abilityCounts[cat] = (abilityCounts[cat]||0)+1;
  }));
  if(abilityCounts['자립심']) hints.push('스스로 해보려는 순간에는 먼저 나서지 말고 맡기고 지켜봐주면 자립심이 더 자라요.');
  if(abilityCounts['사회성']) hints.push('또래나 가족과의 대화 시간이 요즘 특히 도움이 되는 시기예요.');
  if(abilityCounts['집중력']) hints.push('집중력이 높아지는 활동을 발견하면, 그 활동을 충분히 더 할 수 있게 해주면 좋아요.');

  if(!hints.length) return '';
  const items = hints.slice(0,4).map(h=>`<div><span class="check">✔</span>${h}</div>`).join('');
  return `<div class="highlight-list">${items}</div>`;
}

// 전체 회차를 작은 썸네일 줄로 훑어볼 수 있는 미리보기 갤러리.
// 클릭하면 해당 회차의 자세한 카드로 스크롤 이동해요.
function renderGallery(entries){
  const el = document.getElementById('jGallery');
  if(!entries.length){ el.innerHTML = ''; return; }
  const items = entries.map((e,i) => `
    <div class="gallery-item" onclick="document.getElementById('month-${i}').scrollIntoView({behavior:'smooth', block:'start'})">
      ${e.photo1 ? `<img class="gallery-thumb" src="${e.photo1}" alt="${e.month}" onerror="this.style.display='none'">` : `<div class="gallery-thumb-empty">사진 없음</div>`}
      <div class="gallery-caption"><b>${e.month}</b>${e.title ? `「${e.title}」` : ''}</div>
    </div>`).join('');
  el.innerHTML = `
    <div class="gallery-heading">전체 기록 한눈에 보기 (총 ${entries.length}회) · 클릭하면 해당 회차로 이동해요</div>
    <div class="gallery-wrap">
      ${entries.length > 4 ? `<button class="gallery-nav prev" onclick="scrollGallery(-1)" aria-label="이전">‹</button>` : ''}
      <div class="gallery-strip" id="galleryStrip">${items}</div>
      ${entries.length > 4 ? `<button class="gallery-nav next" onclick="scrollGallery(1)" aria-label="다음">›</button>` : ''}
    </div>`;
}
function scrollGallery(dir){
  const strip = document.getElementById('galleryStrip');
  if(strip) strip.scrollBy({ left: dir * 340, behavior: 'smooth' });
}

// 한 회차에 사진이 1~4장 들어올 수 있어서, 장수에 맞게 배치를 바꿔줘요.
function photoGridHtml(e){
  const photos = [e.photo1, e.photo2, e.photo3, e.photo4].filter(Boolean);

}

let _lastName = '', _lastPhone4 = '';
// 한 회차의 성장 능력을 보여줘요. "미술능력/마음의 능력/신체능력" 칸에 직접
// 적어두셨으면 그대로 그룹별로 보여주고(가장 정확함), 옛 방식으로 한 칸에 자유
// 텍스트로만 적힌 옛 기록은 자동 분류(미술/마음 2그룹)로 대신 보여줘요.
function renderEntryAbilities(e){
  const pills = txt => String(txt||'').split(/[,、\n·]/).map(s=>s.trim()).filter(Boolean).map(t=>`<span class="pill">${t}</span>`).join('');
  const hasExplicit = e.artAbility || e.mindAbility || e.bodyAbility;
  if(hasExplicit){
    let html = '';
    if(e.artAbility) html += `<div class="ability-mini-group"><span class="ability-mini-label">미술능력</span><div class="material-pills">${pills(e.artAbility)}</div></div>`;
    if(e.mindAbility) html += `<div class="ability-mini-group"><span class="ability-mini-label">마음의 능력</span><div class="material-pills">${pills(e.mindAbility)}</div></div>`;
    if(e.bodyAbility) html += `<div class="ability-mini-group"><span class="ability-mini-label">신체능력</span><div class="material-pills">${pills(e.bodyAbility)}</div></div>`;
    return html;
  }
  const tokens = String(e.growingAbility||'').split(/[,、\n·]/).map(s=>s.trim()).filter(Boolean);
  if(!tokens.length) return '';
  const art = [], mind = [], other = [];
  tokens.forEach(t=>{
    const cat = categorizeAbility(t);
    const group = cat ? ABILITY_GROUP[cat] : null;
    if(group === '미술능력') art.push(t);
    else if(group === '마음의 능력') mind.push(t);
    else other.push(t);
  });
  const pillsArr = arr => arr.map(t=>`<span class="pill">${t}</span>`).join('');
  let html = '';
  if(art.length) html += `<div class="ability-mini-group"><span class="ability-mini-label">미술능력</span><div class="material-pills">${pillsArr(art)}</div></div>`;
  if(mind.length) html += `<div class="ability-mini-group"><span class="ability-mini-label">마음의 능력</span><div class="material-pills">${pillsArr(mind)}</div></div>`;
  if(other.length) html += `<div class="ability-mini-group"><span class="ability-mini-label">기타</span><div class="material-pills">${pillsArr(other)}</div></div>`;
  return html;
}

function checkJournal(){
  const name = document.getElementById('jName').value.trim();
  const phone4 = document.getElementById('jPhone4').value.trim();
  const errEl = document.getElementById('jErr');
  errEl.textContent = '';

  if(!name || phone4.length !== 4){
    errEl.textContent = '이름과 전화번호 뒷자리 4자리를 정확히 입력해주세요.';
    return;
  }
  _lastName = name; _lastPhone4 = phone4;

  const btn = document.querySelector('.login-btn');
  btn.disabled = true; btn.textContent = '확인 중...';

  const params = new URLSearchParams({ action:'journal', name, phone4 });
  fetch(GAS_URL + '?' + params.toString())
    .then(r => r.json())
    .then(data => {
      btn.disabled = false; btn.textContent = '성장카르테 확인하기';
      if(!data.found){
        errEl.textContent = data.message || '일치하는 기록이 없어요.';
        return;
      }
      renderJournal(data);
    })
    .catch(() => {
      btn.disabled = false; btn.textContent = '성장카르테 확인하기';
      errEl.textContent = '불러오는 중 문제가 발생했어요. 잠시 후 다시 시도해주세요.';
    });
}

function renderJournal(data){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('journalView').style.display = 'block';
  document.getElementById('jChildName').textContent = `${data.name} 어린이`;
  document.getElementById('jTerm').textContent = data.term || '';

  const entries = buildAutoInsights(data.entries || []);
  _journalState = { entries, summary: data.summary, name: data.name, narrativeOverride: data.narrativeOverride, hintsOverride: data.hintsOverride };

  // 표지 대표 사진: 첫 기록의 사진1 사용
  const coverImg = entries.find(e => e.photo1)?.photo1;
  document.getElementById('coverPhotoRing').innerHTML = coverImg
    ? `<img src="${coverImg}" alt="대표 사진" onerror="this.parentElement.style.background='var(--ivory-deep)'">`
    : '';

  document.getElementById('jStatRow').innerHTML = `
    <div><b>${entries.length}</b>총 기록 개월수</div>
    <div><b>${new Set(entries.map(e=>e.mainColor).filter(Boolean)).size}</b>사용한 컬러 수</div>
  `;

  const wrap = document.getElementById('jEntries');
  if(entries.length === 0){
    wrap.innerHTML = '<div class="empty-state">아직 등록된 월별 기록이 없어요. 다음 달부터 차곡차곡 쌓일 예정이에요 🌿</div>';
    return;
  }

  renderGallery(entries);

  wrap.innerHTML = entries.map((e, i) => `
    <div class="month-card" id="month-${i}">
      <div class="month-num">${String(i+1).padStart(2,'0')}</div>
      <div class="month-title-row">
        <span class="month-badge">${e.month}</span>
        ${e.title ? `<div class="artwork-title">「${e.title}」</div>` : ''}
        ${e.sessionTheme ? `<div class="session-theme">이번 회차 목표 · ${e.sessionTheme}</div>` : ''}
      </div>
      <div class="carte-grid">
        <div>
          ${photoGridHtml(e)}
          <div class="observation">
            <span class="observation-label">꽃밭샘 관찰</span>
            ${e.note || '이 달의 관찰 기록이 아직 입력되지 않았어요.'}
          </div>
          ${e.autoInsight ? `
          <div class="auto-insight">
            <span class="observation-label" style="color:var(--sage);">✨ 지난 회차와 비교</span>
            ${e.autoInsight}
          </div>` : ''}
        </div>
        <div>
          ${(e.beforeColor || e.afterColor) ? `
          <div class="info-block">
            <span class="info-label">수업 전 → 수업 후 마음</span>
            <div class="mood-flow">
              <div class="mood-swatch-wrap"><span class="swatch-lg" style="background:${toneHex(e.beforeColor, e.tone)}"></span><span>${e.beforeColor || '-'}</span>${e.beforeMoodNote ? `<span class="mood-note">"${e.beforeMoodNote}"</span>` : ''}</div>
              <span class="mood-arrow">→</span>
              <div class="mood-swatch-wrap"><span class="swatch-lg" style="background:${toneHex(e.afterColor, e.tone)}"></span><span>${e.afterColor || '-'}</span>${e.afterMoodNote ? `<span class="mood-note">"${e.afterMoodNote}"</span>` : ''}</div>
            </div>
          </div>` : ''}
          ${e.selfColor ? `
          <div class="info-block">
            <span class="info-label">자신을 나타내는 색</span>
            <div class="color-row">
              <span class="swatch" style="background:${toneHex(e.selfColor, e.tone)}"></span>
              <span>${e.selfColor}</span>
            </div>
          </div>` : ''}
          ${(e.color1 || e.color2 || e.color3) ? `
          <div class="info-block">
            <span class="info-label">작품색${e.tone ? ` · ${e.tone}` : ''}</span>
            <div class="color-chip-row">
              ${[e.color1,e.color2,e.color3].filter(Boolean).map(c=>`
              <div class="color-chip"><span class="swatch" style="background:${toneHex(c,e.tone)}"></span><span>${c}</span></div>`).join('')}
            </div>
          </div>` : ''}
          ${e.materials ? `
          <div class="info-block">
            <span class="info-label">사용 재료</span>
            <div class="material-pills">${e.materials.split(/[,、]/).map(m=>`<span class="pill">${m.trim()}</span>`).join('')}</div>
          </div>` : ''}
          ${(e.emotionKeywords && e.emotionKeywords.length) ? `
          <div class="info-block">
            <span class="info-label">감정 키워드</span>
            <div class="material-pills">${e.emotionKeywords.map(k=>`<span class="pill">${k}</span>`).join('')}</div>
          </div>` : ''}
          ${e.engagement ? `
          <div class="info-block">
            <span class="info-label">몰입도</span>
            <div class="material-pills"><span class="pill">${e.engagement}</span></div>
          </div>` : ''}
          ${e.materialTendency ? `
          <div class="info-block">
            <span class="info-label">재료 선택의 경향</span>
            <p class="info-note">${e.materialTendency}</p>
          </div>` : ''}
          ${(e.growingAbility || e.artAbility || e.mindAbility || e.bodyAbility) ? `
          <div class="info-block">
            <span class="info-label">성장하고 있는 능력</span>
            ${renderEntryAbilities(e)}
          </div>` : ''}
          ${e.styleNotes ? `
          <div class="info-block">
            <span class="info-label">그림 스타일 특징</span>
            <p class="info-note">${e.styleNotes}</p>
          </div>` : ''}
          ${(e.goalTags && e.goalTags.length) ? `
          <div class="info-block">
            <span class="info-label">이번 회차 목표행동</span>
            <div class="material-pills">${e.goalTags.map(t=>`<span class="pill" style="background:#EFF4EC; border-color:#D7E3CF; color:var(--forest);">${t}</span>`).join('')}</div>
          </div>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  renderSummaryFilter(entries.length, data.range);
  const total = entries.length;
  const savedFrom = (data.range && data.range.from) ? Math.max(1, Math.min(data.range.from, total)) : 1;
  const savedTo = (data.range && data.range.to) ? Math.max(1, Math.min(data.range.to, total)) : total;
  const initialSlice = entries.slice(savedFrom - 1, savedTo);
  renderSummarySection(initialSlice, data.summary, data.name, data.narrativeOverride, data.hintsOverride);
}

// 종합요약(자동 생성 부분)만 원하는 회차 범위로 좁혀볼 수 있는 필터.
// 회차별 카드 자체는 항상 전체가 다 보이고, 이 필터는 아래 종합요약에만 영향을 줘요.
// 선생님 모드에서만 UI가 보이고, 저장하면 학부모 화면에도 그 범위가 그대로 반영돼요.
let _journalState = null;
function renderSummaryFilter(total, savedRange){
  document.getElementById('jTeacherBadge').style.display = isTeacher ? 'inline-block' : 'none';
  const el = document.getElementById('jSummaryFilter');
  if(!el) return;
  if(!isTeacher || total < 2){ el.innerHTML = ''; return; }
  const from = (savedRange && savedRange.from) ? Math.max(1, Math.min(savedRange.from, total)) : 1;
  const to = (savedRange && savedRange.to) ? Math.max(1, Math.min(savedRange.to, total)) : total;
  const opts = selected => Array.from({length: total}, (_,i) => `<option value="${i+1}"${i+1===selected?' selected':''}>${i+1}회차</option>`).join('');
  el.innerHTML = `
    <div class="summary-filter">
      <span>🔑 종합요약으로 볼 범위</span>
      <select id="jFromSel" onchange="applySummaryFilter()">${opts(from)}</select>
      <span>~</span>
      <select id="jToSel" onchange="applySummaryFilter()">${opts(to)}</select>
      <button type="button" class="filter-reset" onclick="resetSummaryFilter()">전체보기</button>
      <button type="button" class="filter-save" onclick="saveSummaryFilter()">이 범위로 학부모 화면에도 저장</button>
      <span class="filter-saved-msg" id="jFilterSavedMsg"></span>
    </div>`;
}
function applySummaryFilter(){
  if(!_journalState) return;
  const from = parseInt(document.getElementById('jFromSel').value, 10);
  const to = parseInt(document.getElementById('jToSel').value, 10);
  const lo = Math.min(from, to) - 1, hi = Math.max(from, to);
  const subset = _journalState.entries.slice(lo, hi);
  renderSummarySection(subset, _journalState.summary, _journalState.name, _journalState.narrativeOverride, _journalState.hintsOverride);
}
function resetSummaryFilter(){
  if(!_journalState) return;
  const fromSel = document.getElementById('jFromSel'), toSel = document.getElementById('jToSel');
  if(fromSel) fromSel.value = 1;
  if(toSel) toSel.value = _journalState.entries.length;
  applySummaryFilter();
}
function saveSummaryFilter(){
  const from = document.getElementById('jFromSel').value;
  const to = document.getElementById('jToSel').value;
  const msg = document.getElementById('jFilterSavedMsg');
  msg.textContent = '저장 중...';
  const params = new URLSearchParams({ action:'saveSummaryRange', name:_lastName, phone4:_lastPhone4, from, to });
  fetch(GAS_URL + '?' + params.toString())
    .then(r => r.json())
    .then(() => { msg.textContent = '✔ 저장했어요 — 학부모 화면에도 이 범위로 보여요'; })
    .catch(() => { msg.textContent = '저장에 실패했어요. 다시 시도해주세요.'; });
}

function renderSummarySection(entries, summary, childName, narrativeOverride, hintsOverride){
  const box = document.getElementById('jSummary');
  const colored = entries.filter(e => e.mainColor);

  // 자동 생성: 색채 타임라인
  let timelineHtml = '';
  if(colored.length){
    timelineHtml = `
      <div class="timeline-card">
        <div class="timeline">
          ${colored.map(e => `
            <div class="t-node">
              <div class="r">${e.month}</div>
              <div class="t-dot" style="background:${MAIN_COLOR_HEX[e.mainColor] || '#ccc'}"></div>
              <div class="c">${e.mainColor}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  // 자동 생성: 색 사용 빈도
  let freqHtml = '';
  if(colored.length){
    const counts = {};
    colored.forEach(e => counts[e.mainColor] = (counts[e.mainColor]||0) + 1);
    const max = Math.max(...Object.values(counts));
    const rows = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([color,count])=>`
      <div class="freq-row">
        <div class="freq-label">${color}</div>
        <div class="freq-bar-bg"><div class="freq-bar" style="width:${(count/max*100)}%; background:${MAIN_COLOR_HEX[color] || '#ccc'};"></div></div>
        <div class="freq-count">${count}</div>
      </div>`).join('');
    freqHtml = `<div class="freq-card">${rows}</div>`;
  }

  let autoSection = '';
  {
    const wheelHtml = renderColorWheel(entries);
    const colorToneWheelHtml = renderColorToneWheel(entries);
    const materialWheelHtml = renderMaterialWheel(entries);
    const toneGridHtml = renderToneGrid(entries);
    const effectBalanceHtml = renderEffectBalance(entries);
    const keywordCloudHtml = renderKeywordCloud(entries);
    const abilityBoardHtml = renderAbilityBoard(entries);
    const narrativeHtml = (narrativeOverride && narrativeOverride.trim())
      ? `<div class="growth-narrative">✨ ${narrativeOverride.trim()}</div>`
      : renderGrowthNarrative(entries, childName);
    const hintsHtml = (hintsOverride && hintsOverride.length)
      ? `<div class="highlight-list">${hintsOverride.map(h=>`<div><span class="check">✔</span>${h}</div>`).join('')}</div>`
      : renderParentingHints(entries);

    const colorFlowHtml = (wheelHtml || timelineHtml || freqHtml) ? `${wheelHtml}${timelineHtml}${freqHtml}` : '';

    const sections = [
      { title:'성장 한 문장', html: narrativeHtml },
      { title:'회차별 색채 변화', html: colorFlowHtml },
      { title:'6개월 색채 여정 (색상 · 톤)', html: colorToneWheelHtml },
      { title:'색으로 보는 마음의 결', html: toneGridHtml },
      { title:'싹트고 있는 능력', html: abilityBoardHtml },
      { title:'재료 효과 바퀴 (사고·감정·뉴트럴)', html: materialWheelHtml },
      { title:'재료 효과 비율', html: effectBalanceHtml },
      { title:'자주 나온 감정 · 성장 키워드', html: keywordCloudHtml },
      { title:'양육 힌트', html: hintsHtml }
    ].filter(s => s.html);

    const LETTERS = 'ABCDEFGHIJ';
    if(sections.length){
      autoSection = `
        <div class="summary-section">
          ${sections.map((s,i) => `
            <div class="sec-label" style="${i>0?'margin-top:24px;':''}"><span class="sec-letter">${LETTERS[i] || '•'}</span><h3>${s.title}</h3></div>
            ${s.html}`).join('')}
        </div>`;
    }
  }

  // 원장님 작성: 카테고리 요약 + 강점/방향
  let manualSection = '';
  if(summary){
    const cat = (icon, name, before, after) => (before || after) ? `
      <div class="cat-card"><div class="name">${icon} ${name}</div><div class="flow">${before||'-'} <span class="arrow">→</span> ${after||'-'}</div></div>` : '';

    const cats = [
      cat('🔵','표현', summary.expression?.before, summary.expression?.after),
      cat('🟢','색채', summary.color?.before, summary.color?.after),
      cat('🟡','심리', summary.psychology?.before, summary.psychology?.after),
      cat('🔴','사고', summary.thinking?.before, summary.thinking?.after),
    ].filter(Boolean).join('');

    const highlights = (summary.highlights||[]).map(h => `<div><span class="check">✔</span>${h}</div>`).join('');

    manualSection = `
      <div class="summary-section">
        <div class="sec-label"><span class="tag tag-manual">꽃밭샘 종합 관찰</span><h3>성장 카테고리 요약</h3></div>
        ${cats ? `<div class="cat-grid">${cats}</div>` : ''}
        ${highlights ? `<div class="highlight-list">${highlights}</div>` : ''}
        ${(summary.strength || summary.direction) ? `
        <div class="split">
          ${summary.strength ? `<div class="split-card strength"><h4>강점</h4><p>${summary.strength}</p></div>` : ''}
          ${summary.direction ? `<div class="split-card direction"><h4>앞으로의 방향</h4><p>${summary.direction}</p></div>` : ''}
        </div>` : ''}
      </div>`;
  }

  box.innerHTML = autoSection + manualSection;
}

function logoutJournal(e){
  e.preventDefault();
  document.getElementById('journalView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('jName').value = '';
  document.getElementById('jPhone4').value = '';
  document.getElementById('jErr').textContent = '';
}
</script>
